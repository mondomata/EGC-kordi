<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EGC kereső</title>
    
    <!-- Helyi minimális stíluslap -->
    <link rel="stylesheet" href="style.css">
    
    <!-- Leaflet Alap CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <!-- Proj4js a pontos EOV (EPSG:23700) transzformációhoz (KÖTELEZŐ) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.9.0/proj4.js"></script>
</head>
<body>
    <div class="logo-container">
        <header>
            <div>         
                <img class="logo" src="FlagHun.png" alt="Hun Flag">
                <h1> 
                    <span style="padding: 0 4px;text-shadow: 2px 2px 4px lightblue;border: solid 1px ghostwhite;border-radius: 4px;">"EGC-kordi" &#128506;</span> Kereső 
                </h1>
                <p>Egységes Országos Vetületi Rendszer (EOV), GPS és címalapú koordináta kereső</p>
            </div>
        </header>
    </div>

    <main> 
        <aside>
                <!-- 1. Google Térkép Címkeresõ Kártya -->
            <div class="card">
                <div class="card-header">
                    <span class="custom-icon">&#128270;</span>
                    <span class="card-title">EGC címkereső</span>
                    <span class="custom-icon" style="font-size:2rem">&#128506;</span>
                    <!-- <button type="button" class="mode-link" style="text-decoration:none;color:brown;" onMouseOver="alert('1. Cím beírás + «Keresés»-sel felugró ablakban megnyílik a Google Térkép a keresett helyet megjelölve.\n2. Kattints jobb egérgombbal a piros helyjelzőre, majd a felugró legfelső sorra (GPS koordináták), így a vágólapra másolod.\n3. Térj vissza ide, kattints a «GPS beillesztés» gombra!\nAz EGC-n látni fogod a helyszínt és a GPS-OEV Konverziót.')">&#128161; ?</button> -->
                </div>
                
                <form id="googleSearchForm" onsubmit="event.preventDefault(); openInGoogleMaps();">
                    <div class="form-group">
                        <label for="googleAddressInput">Település, utca, házszám:<span style="font-size:12px; color: gray"><br>pl. Pécs, Kálvária utca 2</span></label>
                        <div class="input-wrapper">
                            <input type="text" id="googleAddressInput" placeholder="Keresett cím (google)" class="input-field" style="padding-left:10px;">
                        </div>
                    </div>
                    <div style="display: flex; gap: 5px; margin-top: 8px;">
                        <button type="button" onclick="openInGoogleMaps()" class="btn-primary" style="flex: 1;">Keresés↗</button>
                        <button type="button" onclick="pasteFromGoogle()" class="btn-primary" style="flex: 1; background-color: #28a745;">GPS beilleszt</button>
                    </div>
                </form>
            </div>

            <!-- 2. Koordináta Beviteli Kártya (EOV / GPS) -->
            <div class="card">
                <div class="card-header">
                    <span class="custom-icon">&#128270;</span>
                    <span id="formTitle" class="card-title">EOV Koordináta</span>
                    <span class="custom-icon">&#128257;</span>
                    <a id="toggleModeLink" class="mode-link" onclick="toggleSearchMode()">GPS?</a>
                </div>
                
                <form id="coordForm">
                    <!-- EOV Mezõk -->
                    <div id="eovFields">
                        <div class="form-group">
                            <label for="yCoord">Y koordináta (Kelet-Nyugat):<small>~400E-900E m</small></label>
                            <div class="input-wrapper">
                                <span class="input-prefix">Y</span>
                                <input type="number" step="any" id="yCoord" placeholder="pl. 587155" class="input-field" required>
                                <span class="input-suffix">m</span>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="xCoord">X koordináta (Észak-Dél):<small>~40E-350E m</small></label>
                            <div class="input-wrapper">
                                <span class="input-prefix">X</span>
                                <input type="number" step="any" id="xCoord" placeholder="pl. 81255" class="input-field" required>
                                <span class="input-suffix">m</span>
                            </div>
                        </div>
                    </div>

                    <!-- GPS Mezõk -->
                    <div id="gpsFields" class="hidden">
                        <div class="form-group">
                            <label for="latCoord">Északi szélesség (Lat):<small>pl. 47.496</small></label>
                            <div class="input-wrapper">
                                <span class="input-prefix">N</span>
                                <input type="number" step="any" id="latCoord" placeholder="pl. 47.496" class="input-field">
                                <span class="input-suffix">°</span>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="lngCoord">Keleti hosszúság (Lng):<small>pl. 19.040</small></label>
                            <div class="input-wrapper">
                                <span class="input-prefix">E</span>
                                <input type="number" step="any" id="lngCoord" placeholder="pl. 19.040" class="input-field">
                                <span class="input-suffix">°</span>
                            </div>
                        </div>
                    </div>

                    <div class="btn-group">
                        <button type="submit" class="btn-primary">Mutatás térképen</button>
                        <button type="button" id="clearBtn" class="btn-secondary" title="Törlés">&#10799;</button>
                    </div>
                </form>
            </div>

            <!-- Eredmények -->
            <div id="resultsPanel" class="results-panel hidden">
                <div class="card-title">Konverzió:</div>
                <div class="results-row"><span class="results-label">EOV Y:</span><span id="resY" class="results-val">-</span></div>
                <div class="results-row"><span class="results-label">EOV X:</span><span id="resX" class="results-val">-</span></div>
                <div class="results-row"><span class="results-label">GPS Szélesség (Lat):</span><span id="resLat" class="results-val">-</span></div>
                <div class="results-row"><span class="results-label">GPS Hosszúság (Lng):</span><span id="resLng" class="results-val">-</span></div>
            </div>

            <!-- Gyors gombok -->
            <div>
                <button type="button" onclick="setPreset(844396, 246077, 'Debrecen [RFK]')" class="preset-btn">
                    <div class="preset-title">Debrecen</div>
                    <div class="preset-coords">Y: 844396, X: 246077</div>
                </button>
                <button type="button" onclick="setPreset(544523, 259942, 'Gyõr [RFK]')" class="preset-btn">
                    <div class="preset-title">Gyõr</div>
                    <div class="preset-coords">Y: 544523, X: 259942</div>
                </button>            
                <button type="button" onclick="setPreset(780285, 308157, 'Miskolc [RFK]')" class="preset-btn">
                    <div class="preset-title">Miskolc</div>
                    <div class="preset-coords">Y: 780285, X: 308157</div>
                </button>
                <button type="button" onclick="setPreset(734519, 102051, 'Szeged [RFK]')" class="preset-btn">
                    <div class="preset-title">Szeged</div>
                    <div class="preset-coords">Y: 734519, X: 102051</div>
                </button>
                <button type="button" onclick="setPreset(587155, 81255, 'Pécs Légszeszgyár utca 8 [TIK]')" class="preset-btn">
                    <div class="preset-title">Pécs TIK &#127774;</div>
                    <div class="preset-coords">Y: 587155, X: 81255</div>
                </button>
            </div>

        </aside>

        <!-- Térkép Munkaterület -->
        <div id="map-container">
            <div id="map"></div>
            <div id="notification" class="hidden">
                <span id="notificationText">Pozíció frissítve</span>
            </div>
        </div>
    </main>

    <script src="map.js"></script>
</body>
</html>
